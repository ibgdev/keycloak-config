services:
  mysql:
    image: mysql:8.0.36
    container_name: kc_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: keycloak_db
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: keycloak_pass
      MYSQL_ROOT_PASSWORD: root_pass
    volumes:
      - kc_mysqldata:/var/lib/mysql
    networks:
      - kc_net
    restart: no

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    depends_on:
      - mysql
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123

      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass

      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - kc_net
    restart: unless-stopped
    volumes:
      - ./providers:/opt/keycloak/providers:ro

volumes:
  kc_mysqldata:

networks:
  kc_net:

